<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 48 48"><style>.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.1s ease-in-out infinite alternate}
.spark{animation:twinkle 1.6s ease-in-out infinite}.s2{animation-delay:.5s}.s3{animation-delay:1s}
.bob{transform-box:fill-box;transform-origin:50% 100%;animation:bob 1.5s ease-in-out infinite}
.shadow{transform-box:fill-box;transform-origin:50% 50%;animation:shadow 1.5s ease-in-out infinite}
.glow{animation:glow 1.1s ease-in-out infinite alternate}
@keyframes flick{from{transform:scale(1,1)}to{transform:scale(.86,1.18)}}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes bob{0%,100%{transform:scale(1,1)}50%{transform:scale(1.06,.93)}}
@keyframes shadow{0%,100%{transform:scaleX(1);opacity:1}50%{transform:scaleX(1.08);opacity:.8}}
@keyframes glow{from{opacity:.08}to{opacity:.35}}
@media (prefers-reduced-motion:reduce){.flame,.spark,.bob,.shadow,.glow{animation:none}}</style><defs>
    <linearGradient id="g-vip" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9acff"/><stop offset=".55" stop-color="#6366f1"/><stop offset="1" stop-color="#4548d6"/></linearGradient>
    <linearGradient id="g-pink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b8ef5"/><stop offset="1" stop-color="#4f52e0"/></linearGradient>
    <linearGradient id="g-pink2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b4b6fa"/><stop offset="1" stop-color="#7f82f2"/></linearGradient>
    <linearGradient id="g-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c9cfff"/></linearGradient>
    <linearGradient id="g-orange" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9b6ff"/><stop offset="1" stop-color="#536dfe"/></linearGradient>
    <linearGradient id="g-blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fa2ff"/><stop offset="1" stop-color="#4b63f2"/></linearGradient>
    <linearGradient id="g-blue2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b5c1ff"/><stop offset="1" stop-color="#7388fb"/></linearGradient>
    <linearGradient id="g-cream" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2f3ff"/><stop offset="1" stop-color="#c3c9ff"/></linearGradient>
  </defs>
    <g class="spark"><circle cx="6" cy="12" r="2" fill="#8da0ff"/></g>
    <g class="spark s2"><circle cx="42" cy="9" r="2" fill="#6366f1"/></g>
    <g class="spark s3"><circle cx="43" cy="27" r="1.8" fill="#4b63f2"/></g>
    <ellipse class="shadow" cx="24" cy="44.5" rx="18" ry="2.4" fill="rgba(0,0,0,.14)"/>
    <g class="bob">
    <circle class="glow" cx="24" cy="6.5" r="7" fill="#8da0ff" opacity=".0"/>
    <rect x="6" y="29" width="36" height="14" rx="7" fill="url(#g-pink)"/>
    <rect x="11" y="19" width="26" height="14" rx="7" fill="url(#g-cream)"/>
    <path d="M9 31q3 4 6 0t6 0 6 0 6 0 6 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="21.8" y="10" width="4.4" height="11" rx="2.2" fill="url(#g-blue)"/>
    <path class="flame" d="M24 2.5c3 3.4 3 6 0 8.4-3-2.4-3-5 0-8.4z" fill="url(#g-orange)"/>
    <ellipse cx="14" cy="35" rx="3" ry="1.6" fill="#fff" opacity=".5"/>
    <ellipse cx="17" cy="23" rx="3" ry="1.5" fill="#fff" opacity=".6"/>
    </g>
  </svg>