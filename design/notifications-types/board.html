<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>انواع اعلان‌ها</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;900&display=swap">
<style>
/* Layout concept: every notification kind drawn once, in the real 384px extension panel and in the mobile app list side by side, plus a tab that lists the data each kind carries (avatar, icon, decoration). */
:root {
  --ink: 70, 70, 71;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --surface-3: #f1f5f9;
  --fg-strong: #464647;
  --fg: rgba(var(--ink), .9);
  --fg-muted: rgba(var(--ink), .7);
  --fg-faint: rgba(var(--ink), .5);
  --fill: rgba(var(--ink), .05);
  --fill-2: rgba(var(--ink), .1);
  --line: rgba(var(--ink), .15);
  --brand: #536dfe;
  --brand-fill: rgba(83, 109, 254, .1);
  --brand-fill-2: rgba(83, 109, 254, .2);
  --success: #00d390;
  --warning: #fcb700;
  --stage: #aebbd6;
  --board: #eef1f6;
  --font: "Vazirmatn", "Vazir", Tahoma, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: 240, 240, 245;
    --surface: #1c1f27; --surface-2: #232733; --surface-3: #2b3040;
    --fg-strong: #f1f1f4; --stage: #3b4560; --board: #14161c;
    --brand: #8da0ff; --brand-fill: rgba(141, 160, 255, .14); --brand-fill-2: rgba(141, 160, 255, .24);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ink: 240, 240, 245;
  --surface: #1c1f27; --surface-2: #232733; --surface-3: #2b3040;
  --fg-strong: #f1f1f4; --stage: #3b4560; --board: #14161c;
  --brand: #8da0ff; --brand-fill: rgba(141, 160, 255, .14); --brand-fill-2: rgba(141, 160, 255, .24);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--board); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.7;
  padding-block: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3, h4, p { margin: 0; }
button { font: inherit; color: inherit; }
svg { display: block; flex: none; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
[hidden] { display: none !important; }
.wrap { max-width: 1120px; margin-inline: auto; display: grid; gap: 16px; }
.intro { display: grid; gap: 6px; }
.intro h1 { font-size: 20px; font-weight: 700; color: var(--fg-strong); }
.intro p { color: var(--fg-muted); max-width: 78ch; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); }
.tab { border: 0; background: none; padding: 10px 14px; cursor: pointer; color: var(--fg-muted); font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--brand); border-bottom-color: var(--brand); }

.stage { background: var(--stage); border-radius: 24px; padding: 24px; display: flex; flex-wrap: wrap; gap: 28px; justify-content: center; align-items: flex-start; }
.col { display: grid; gap: 10px; justify-items: center; min-width: 0; max-width: 100%; }
.cap { font-size: 12px; font-weight: 700; color: var(--fg-strong); background: var(--surface); border-radius: 999px; padding: 2px 14px; }

.panel { width: 384px; max-width: 100%; background: var(--surface-2); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 12px 32px rgba(0,0,0,.18); display: grid; overflow: hidden; }
.p-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 14px 8px; }
.p-title { font-size: 14px; font-weight: 700; color: var(--fg-strong); }
.text-btn { border: 0; background: none; cursor: pointer; font-size: 11px; font-weight: 600; color: var(--fg-muted); border-radius: 8px; padding: 4px 8px; min-height: 28px; }
.sec { font-size: 10px; font-weight: 700; color: var(--fg-faint); padding: 10px 8px 4px; }
.list { padding: 0 8px 10px; display: grid; gap: 6px; align-content: start; }

.card { position: relative; display: flex; gap: 10px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; }
.card.unread { background: var(--brand-fill); border-color: var(--brand-fill-2); }
.card .txt { flex: 1; min-width: 0; display: grid; gap: 2px; }
.card h4 { font-size: 13px; font-weight: 700; color: var(--fg-strong); }
.card .body { font-size: 11px; font-weight: 500; color: var(--fg-muted); line-height: 1.8; }
.card .body b { color: var(--fg-strong); font-weight: 700; }
.card .time { font-size: 10px; color: var(--fg-faint); }
.card .x { border: 0; background: none; color: var(--fg-faint); width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; cursor: pointer; }

.lead { position: relative; flex: none; display: grid; place-items: center; }
.av { border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; flex: none; }
.av.a { background: linear-gradient(135deg, #7c8cff, #536dfe); }
.av.b { background: linear-gradient(135deg, #ff9db0, #ff627d); }
.av.c { background: linear-gradient(135deg, #5fe3b6, #00b57a); }
.stack { position: relative; }
.stack .av { position: absolute; border: 2px solid var(--surface); }
.card.unread .stack .av { border-color: var(--surface-2); }
.deco { position: absolute; pointer-events: none; }
.cake .flame { transform-origin: 50% 100%; animation: flick 1.1s ease-in-out infinite alternate; }
.cake .spark { animation: twinkle 1.6s ease-in-out infinite; }
.cake .spark.s2 { animation-delay: .5s; }
.cake .spark.s3 { animation-delay: 1s; }
@keyframes flick { from { transform: scaleY(1) scaleX(1); } to { transform: scaleY(1.18) scaleX(.86); } }
@keyframes twinkle { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .cake .flame, .cake .spark { animation: none; } }
.bare { color: var(--brand); }
.bare.pro { color: var(--warning); }

.m-wrap { width: 360px; max-width: 100%; background: var(--surface-2); border-radius: 28px; border: 1px solid var(--line); box-shadow: 0 12px 32px rgba(0,0,0,.18); overflow: hidden; display: grid; }
.m-top { display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 8px; }
.m-top h2 { font-size: 17px; font-weight: 700; color: var(--fg-strong); }
.m-row { position: relative; display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-top: 1px solid var(--line); background: var(--surface); }
.m-row.unread { background: var(--brand-fill); }
.m-row .txt { flex: 1; min-width: 0; display: grid; gap: 2px; }
.m-row h4 { font-size: 14px; font-weight: 700; color: var(--fg-strong); }
.m-row .body { font-size: 12px; color: var(--fg-muted); line-height: 1.8; }
.m-row .body b { color: var(--fg-strong); font-weight: 700; }
.m-row .time { font-size: 11px; color: var(--fg-faint); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--brand); margin-top: 8px; flex: none; }

.spec { display: grid; gap: 10px; }
.spec-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 10px; }
.spec-card h3 { font-size: 15px; font-weight: 700; color: var(--fg-strong); }
.table { width: 100%; border-collapse: collapse; font-size: 12px; }
.table th { text-align: start; font-size: 11px; color: var(--fg-faint); font-weight: 700; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.table td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; color: var(--fg); }
.table td:first-child { font-weight: 600; color: var(--fg-strong); }
.mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; direction: ltr; unicode-bidi: embed; color: var(--fg-muted); }
.notes { display: grid; gap: 6px; padding-inline-start: 18px; margin: 0; color: var(--fg-muted); }
.scroll-x { overflow-x: auto; }
.cake .bob { transform-box: fill-box; transform-origin: 50% 100%; animation: bob 1.5s ease-in-out infinite; }
.cake .shadow { transform-box: fill-box; transform-origin: 50% 50%; animation: shadow 1.5s ease-in-out infinite; }
.cake .glow { animation: glow 1.1s ease-in-out infinite alternate; }
.cake .flame { transform-box: fill-box; transform-origin: 50% 100%; }
@keyframes bob { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.06, .93); } }
@keyframes shadow { 0%, 100% { transform: scaleX(1); opacity: 1; } 50% { transform: scaleX(1.08); opacity: .8; } }
@keyframes glow { from { opacity: .08; } to { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .cake .bob, .cake .shadow, .cake .glow { animation: none; } }
</style>
</head>

<div class="wrap">
  <div class="intro">
    <h1>انواع اعلان‌ها</h1>
    <p>هر نوع اعلان یک «ظاهر» داره که کلاینت از روی <span class="mono">kind</span> اون رو می‌کشه: آواتار کاربر، آیکون پفی بدون قاب، و یک تزیین کوچیک کنار آواتار (مثل کیک تولد). تزیین‌ها توی خود کلاینت هستن، سرور فقط آدرس آواتار رو می‌فرسته. آواتارها اینجا با دایره‌ی رنگی نشون داده شدن.</p>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-tab="ext">افزونه</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="app">اپ موبایل</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="data">داده‌ی هر نوع</button>
  </div>

  <section id="ext" class="stage"></section>
  <section id="app" class="stage" hidden></section>
  <section id="data" class="spec" hidden></section>

const NAMES = { sara: 'سارا', mehdi: 'مهدی', niloo: 'نیلوفر', me: 'تو' }
const AV = { sara: ['b', 'س'], mehdi: ['a', 'م'], niloo: ['c', 'ن'], me: ['a', 'ت'] }

const ITEMS = [

const num = (n) => String(n)

function avatar(key, size, fs) {
  const [c, ch] = AV[key]
  return `<span class="av ${c}" style="width:${size}px;height:${size}px;font-size:${fs}px">${ch}</span>`
}

function lead(l, size) {
  const fs = Math.round(size * 0.4)
  if (l.icon) return `<span class="lead" style="width:${size}px;height:${size}px"><svg width="${Math.round(size * 1.05)}" height="${Math.round(size * 1.05)}"><use href="#${l.icon}"/></svg></span>`
  if (l.stack) {
    const s = Math.round(size * .66)
    const parts = l.stack.map((k, i) => `<span style="position:absolute;inset-inline-start:${i * Math.round(size * .26)}px;top:${i === 1 ? 0 : Math.round(size * .3)}px;z-index:${3 - i}">${avatar(k, s, Math.round(s * .4))}</span>`).join('')
    return `<span class="lead stack" style="width:${size + Math.round(size * .4)}px;height:${size}px">${parts}</span>`
  }
  const cakeSize = Math.round(size * .95)
  const deco = l.deco === 'cake'
    ? `<svg class="deco cake" width="${cakeSize}" height="${cakeSize}" style="inset-inline-start:-${Math.round(size * .5)}px;bottom:-${Math.round(size * .3)}px" aria-hidden="true"><use href="#cake"/></svg>`
    : ''
  return `<span class="lead" style="width:${size}px;height:${size}px;${l.deco ? `margin-inline-start:${Math.round(size * .5)}px` : ''}">${avatar(l.avatar, size, fs)}${deco}</span>`
}

function extCard(it) {
  return `<div class="card${it.unread ? ' unread' : ''}">
    ${lead(it.lead, 40)}
    <div class="txt"><h4>${it.title}</h4><p class="body">${it.body}</p><p class="time">${it.time}</p></div>
    <button class="x" aria-label="بستن"><svg width="12" height="12"><use href="#i-x"/></svg></button>
  </div>`
}

function mobRow(it) {
  return `<div class="m-row${it.unread ? ' unread' : ''}">
    ${lead(it.lead, 46)}
    <div class="txt"><h4>${it.title}</h4><p class="body">${it.body}</p><p class="time">${it.time}</p></div>
    ${it.unread ? '<span class="dot" aria-label="خوانده نشده"></span>' : ''}
  </div>`
}

function groups(fn, wrapOpen, wrapClose) {
  let html = '', cur = ''
  for (const it of ITEMS) {
    if (it.group !== cur) { cur = it.group; html += `<p class="sec">${cur}</p>` }
    html += fn(it)
  }
  return html
}
