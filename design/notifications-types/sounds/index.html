<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نمونه صدای آیلند</title>
<style>:root{--bg:#eef1f6;--fg:#464647;--brand:#536dfe}@media(prefers-color-scheme:dark){:root{--bg:#14161c;--fg:#f1f1f4;--brand:#8da0ff}}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.7 Vazirmatn,Tahoma,sans-serif;padding:24px 16px;display:grid;gap:12px;max-width:520px;margin-inline:auto}button{font:inherit;border:0;border-radius:999px;background:var(--brand);color:#fff;padding:10px 20px;cursor:pointer;text-align:start}</style>
<h1 style="font-size:18px;margin:0">نمونه صدای آیلند</h1>
<button data-s="1-glass-bell">۱ - زنگوله شیشه‌ای، کوتاه و روشن</button>
<button data-s="2-soft-chime">۲ - چایم نرم، دو نت رو به بالا</button>
<button data-s="3-warm-bell">۳ - زنگوله گرم، بم‌تر و بلندتر</button>
<button data-s="4-bright-ding">۴ - سه دینگ سریع و شاد</button>
<script>document.querySelectorAll('button').forEach(b=>b.onclick=()=>{new Audio('./'+b.dataset.s+'.wav').play()})</script></html>
