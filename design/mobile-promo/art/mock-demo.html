const iconUrl = (glyph, from, to) => 'https://icons.mock/' + encodeURIComponent(glyph) + '/' + from.slice(1) + '/' + to.slice(1)
const iconSvg = (glyph, from, to) => 'data:image/svg+xml;utf8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + from + '"/><stop offset="1" stop-color="' + to + '"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#g)"/><text x="32" y="43" font-size="32" text-anchor="middle">' + glyph + '</text></svg>')
const rewriteSrc = (value) => {
  const m = typeof value === 'string' && value.match(/^https:\/\/icons\.mock\/([^/]+)\/([0-9a-f]+)\/([0-9a-f]+)$/i)
  return m ? iconSvg(decodeURIComponent(m[1]), '#' + m[2], '#' + m[3]) : value
}
const nativeSetAttribute = Element.prototype.setAttribute
Element.prototype.setAttribute = function (name, value) {
  return nativeSetAttribute.call(this, name, name === 'src' && this instanceof HTMLImageElement ? rewriteSrc(value) : value)
}
const srcDescriptor = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src')
Object.defineProperty(HTMLImageElement.prototype, 'src', {
  get: srcDescriptor.get,
  set(value) { srcDescriptor.set.call(this, rewriteSrc(value)) },
})

const iso = (offset) => {
  const d = new Date()
  d.setDate(d.getDate() + offset)
  return d.toISOString().slice(0, 10)
}

const reply = (path) => {
  const p = path.split('?')[0]
  if (p === '/extension/@me') return profile
  if (p.startsWith('/todos/v2/@me')) return { todos, totalPages: 1, totals: todos.length }
  if (p === '/todos/tags' || p.startsWith('/todos/tags')) return ['خونه', 'سلامتی', 'خرید']
  if (p === '/widgets/habits') return { data: { items: habits } }
  if (p === '/notes') return { notes }
  if (p === '/weather/current') {
    return { city: { fa: 'تهران' }, weather: { icon: { url: '' }, description: { text: 'آفتابی و دلپذیر' }, temperature: { temp: 22, temp_max: 25, temp_min: 14, wind_speed: 3, humidity: 41, clouds: 8 } },
      forecast: [{ temp: 23, icon: '', date: new Date(Date.now() + 3 * 3600000).toISOString() }, { temp: 20, icon: '', date: new Date(Date.now() + 6 * 3600000).toISOString() }, { temp: 17, icon: '', date: new Date(Date.now() + 9 * 3600000).toISOString() }] }
  }
  if (p === '/currencies/USD') return { name: { fa: 'دلار', en: 'USD' }, icon: '', price: 71250, rialPrice: 712500, changePercentage: 0.4, url: '', useDollar: false, isPartnerShip: false, partnershipLogo: '' }
  if (p === '/currencies/EUR') return { name: { fa: 'یورو', en: 'EUR' }, icon: '', price: 77900, rialPrice: 779000, changePercentage: -0.2, url: '', useDollar: false, isPartnerShip: false, partnershipLogo: '' }
  if (p === '/users/@me/moods') return moodDays
  if (p === '/friends') return { data: { friends: path.includes('PENDING') ? [] : friends, totalPages: 1 } }
  if (p === '/friends/activities/beta') return { data: { activities, currentUser: 'melisa_sun', attachments: { reactions: [{ id: 'r1', isEmoji: true, content: '❤️' }, { id: 'r2', isEmoji: true, content: '😂' }], templates: [] } } }
  if (p === '/friends/suggestions') return { data: { suggestions: [] } }
  if (p === '/mini-apps/beta/list') return { data: { miniApps, totalPages: 1 } }
  if (p === '/contents') return { contents }
  if (p === '/date/events') return dateEvents
  if (p === '/v2/notifications/feed') return { data: { items: [], nextCursor: null, surfaces: { inbox: [], island: null, dialog: null } } }
  if (p === '/v2/notifications/unread-count') return { data: { count: 3 } }
  return {}
}

const realFetch = window.fetch.bind(window)
window.fetch = (input, init) => {
  const url = typeof input === 'string' ? input : input.url
  if (url.startsWith('http://localhost:4001')) {
    const path = url.replace('http://localhost:4001', '')
    window.__calls.push((init && init.method ? init.method : 'GET') + ' ' + path)
    return Promise.resolve(new Response(JSON.stringify(reply(path)), { status: 200, headers: { 'Content-Type': 'application/json' } }))
  }
  return realFetch(input, init)
}
